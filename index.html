<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL短縮・QRコード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#eef2f5; --surface:#ffffff; --fg:#17242f; --muted:#5c7184;
    --accent:#e4572e; --accent-ink:#ffffff; --line:#c7d2db; --warn:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101a23; --surface:#16222d; --fg:#e8eef3; --muted:#90a3b2;
      --accent:#ff7a45; --accent-ink:#1a0d06; --line:#2b3d4c; --warn:#ff8a80;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    padding:40px 16px;
  }
  .card{
    width:100%; max-width:480px; background:var(--surface);
    border:1px solid var(--line); border-radius:6px; padding:28px 24px;
  }
  h1{font-size:18px; margin:0 0 6px}
  p.lede{color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 20px}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
  input{
    width:100%; font-size:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:4px;
    background:var(--bg); color:var(--fg);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; margin-top:14px; padding:11px 16px;
    font-size:14px; font-weight:600; text-decoration:none;
    background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:4px; cursor:pointer;
  }
  .btn:disabled{opacity:.45; cursor:default}
  .btn.outline{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
  .msg{font-size:13px; line-height:1.7; margin:10px 0 0; color:var(--warn)}
  .result{margin-top:22px; padding-top:20px; border-top:1px solid var(--line)}
  .row{display:flex; gap:8px}
  .row input{flex:1; font-weight:600}
  .row .btn{width:auto; margin-top:0; white-space:nowrap}
  .qr-zone{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:20px}
  .qr-zone canvas{border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .choice{display:flex; flex-direction:column; gap:6px; width:100%; font-size:13px}
  .choice label{display:flex; gap:8px; align-items:flex-start; font-weight:400; margin:0; cursor:pointer; line-height:1.6}
  .choice input{width:auto; margin-top:4px}
  .note{font-size:12px; color:var(--muted); line-height:1.7; margin:8px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="card">
    <h1>URL短縮・QRコード</h1>
    <p class="lede">URLを入れて「作成する」を押すと、短いURLとQRコードを同じ画面に出します。QRコードは<b>ほかのサイトで作らず</b>、この画面のものを使ってください。</p>

    <label for="url">元のURL(お客様に見せたいページ)</label>
    <input id="url" type="text" inputmode="url" placeholder="https://www.maruo1.com/event/〜">
    <button id="make" class="btn" type="button" disabled>作成する</button>
    <p id="msg" class="msg" hidden></p>

    <div id="result" class="result" hidden>
      <label for="short">短いURL(文字で貼るとき用)</label>
      <div class="row">
        <input id="short" type="text" readonly>
        <button id="copy" class="btn outline" type="button">コピー</button>
      </div>
      <p class="note">is.gd の短縮URLです。広告をはさまず、そのまま元のページへ移ります。</p>

      <div class="qr-zone">
        <div class="choice" role="radiogroup" aria-label="QRに入れるもの">
          <label><input type="radio" name="qrkind" value="long" checked><span><b>元のURL</b>(目が細かい・長く使える。ふだんはこちら)</span></label>
          <label><input type="radio" name="qrkind" value="short" id="kindShort"><span><b>短いURL</b>(目が粗い・小さく印刷するとき用。is.gd が止まると読めなくなります)</span></label>
        </div>
        <div id="qrcode"></div>
        <button id="save" class="btn outline" type="button">QRコードを保存</button>
        <p id="qrnote" class="note"></p>
        <p class="note">保存すると印刷用の大きな画像(約1200画素)になります。Excel や Word で小さく縮めても、にじまずに読めます。</p>
        <p id="qrtext" class="note" hidden></p>
      </div>
    </div>
  </div>

<script>
  var input = document.getElementById('url');
  var make = document.getElementById('make');
  var msg = document.getElementById('msg');
  var result = document.getElementById('result');
  var shortBox = document.getElementById('short');
  var copyBtn = document.getElementById('copy');
  var saveBtn = document.getElementById('save');
  var qrHost = document.getElementById('qrcode');

  // 短縮URLを元のURLにすると、QRも短縮サービスを通って広告が出ることがあるので受け付けない
  var SHORTENERS = /^(www\.)?(tinyurl\.com|preview\.tinyurl\.com|bit\.ly|is\.gd|v\.gd|t\.co|ow\.ly|buff\.ly|goo\.gl|x\.gd|cutt\.ly|rebrand\.ly|shorturl\.at|t\.ly)$/i;

  var qrText = document.getElementById('qrtext');
  var qrNote = document.getElementById('qrnote');
  var kindShort = document.getElementById('kindShort');
  var longText = '', longNote = '';
  var NOTE_LONG = 'このQRコードには元のURLがそのまま入っています。短縮サービスを通らないので、読んだときに広告は出ません。印刷は2cm角以上にしてください。';
  var NOTE_SHORT = 'このQRコードには短いURL(is.gd)が入っています。目が粗く小さく印刷しても読みやすい代わりに、is.gd が止まったり広告を入れたりすると読めなくなります。長く配る紙には「元のURL」をおすすめします。';

  function kind(){ return document.querySelector('input[name="qrkind"]:checked').value; }
  // 選んだほうのQRを画面に出す
  function showQR(){
    var useShort = kind() === 'short' && shortBox.value;
    var t = useShort ? shortBox.value : longText;
    if(!t) return;
    qrHost.innerHTML = '';
    qrHost.appendChild(drawQR(t, 280));
    qrHost.dataset.text = t;
    qrNote.textContent = useShort ? NOTE_SHORT : NOTE_LONG;
    qrText.textContent = useShort ? 'QRに入れたURL: ' + t : longNote;
    qrText.hidden = false;
  }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="qrkind"]'), function(r){ r.addEventListener('change', showQR); });

  // 行き先が変わらない飾りの部分(広告の計測用など)を外して、QRの目を粗く・読みやすくする
  var TRACK = /^(utm_[a-z]+|fbclid|gclid|gbraid|wbraid|yclid|msclkid|igsh|igshid|mc_cid|mc_eid|_ga|_gl)$/i;
  function tidy(href){
    var u = new URL(href);
    var host = u.hostname.replace(/^(www\.|m\.)/i, '').toLowerCase();
    var isYT = host === 'youtube.com' || host === 'youtu.be';
    var keys = [];
    u.searchParams.forEach(function(_, k){ keys.push(k); });
    keys.forEach(function(k){
      if(TRACK.test(k) || (isYT && (k === 'si' || k === 'feature' || k === 'pp'))) u.searchParams.delete(k);
    });
    // YouTube の動画は同じ動画へ行く短い形 youtu.be/動画ID にそろえる(再生位置 t は残す)
    if(host === 'youtube.com' && u.pathname === '/watch' && u.searchParams.get('v')){
      var id = u.searchParams.get('v'); u.searchParams.delete('v');
      var rest = u.searchParams.toString();
      return 'https://youtu.be/' + id + (rest ? '?' + rest : '') + u.hash;
    }
    var out = u.href;
    if(out.indexOf('?') >= 0 && !u.search) out = out.replace('?', '');
    return out;
  }

  // is.gd が確認画面をはさむサイト(見つけたら足す)
  function previewSite(href){
    var u = new URL(href), h = u.hostname.toLowerCase();
    if(/(^|\.)(dropbox\.com|dropboxusercontent\.com|db\.tt)$/.test(h)) return 'Dropbox';
    if(h === 'docs.google.com' && /^\/forms\//.test(u.pathname)) return 'Googleフォーム';
    if(/(^|\.)(1drv\.ms|onedrive\.live\.com|sharepoint\.com)$/.test(h)) return 'OneDrive';
    return '';
  }

  function showMsg(text){ msg.textContent = text; msg.hidden = !text; }

  function check(){
    var v = input.value.trim();
    var host = '';
    try { host = new URL(v).hostname; } catch(e) {}
    var ok = /^https?:\/\//i.test(v) && host !== '';
    // 日本語の入ったURLは %xx の形にそろえる(読み取るスマホによって文字化けしないように)
    if(ok) v = new URL(v).href;
    if(ok && SHORTENERS.test(host)){
      showMsg('短縮済みのURL(' + host + ')が入っています。短縮する前の元のURLを入れてください。');
      ok = false;
    } else {
      showMsg('');
    }
    return ok ? tidy(v) : null;
  }

  // 1マスを整数の画素で描き、周りに4マスの白い余白を付ける(半端な大きさだと読めないQRになる)
  // size は画像の大きさの目安(画面は280、保存は1200)
  function drawQR(text, size){
    var qr = qrcode(0, 'M');
    qr.addData(text, 'Byte');
    qr.make();
    var n = qr.getModuleCount(), quiet = 4;
    var cell = Math.max(4, Math.floor(size / (n + quiet * 2)));
    var c = document.createElement('canvas');
    c.width = c.height = (n + quiet * 2) * cell;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000';
    for(var r = 0; r < n; r++){
      for(var k = 0; k < n; k++){
        if(qr.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
      }
    }
    return c;
  }

  input.addEventListener('input', function(){
    // 入力を変えたら古い結果は消す
    result.hidden = true;
    qrHost.innerHTML = '';
    qrHost.dataset.text = '';
    qrText.hidden = true;
    // 新しいURLでは毎回「元のURL」から始める(長く使えるほうを基本に)
    document.querySelector('input[name="qrkind"][value="long"]').checked = true;
    shortBox.value = '';
    make.disabled = !check();
  });

  make.addEventListener('click', function(){
    var v = check();
    if(!v) return;
    make.disabled = true;
    make.textContent = '作成中…';
    longText = v;
    var raw = new URL(input.value.trim()).href;
    longNote = 'QRに入れたURL: ' + v + (raw !== v ? '(広告の計測用などの飾りを外して短くしました。行き先は同じです)' : '');

    // is.gd が英語の確認画面(Shortened link)をはさむサイトは短縮しない(11/15 試して確認: Dropbox・Googleフォーム・OneDrive)
    var site = previewSite(v);
    var job = site
      ? Promise.resolve({ errormessage: null, preview: site })
      : fetch('https://is.gd/create.php?format=json&url=' + encodeURIComponent(v)).then(function(r){ return r.json(); });
    job
      .then(function(d){
        if(d.preview){
          shortBox.value = '';
          showMsg(d.preview + 'のリンクは、短くすると開いたときに英語の確認画面が出てしまうため、短いURLは作りません。QRコード(元のURL)はそのまま使えます。文字で貼るときも元のURLを貼ってください。' + (d.preview === 'Googleフォーム' ? '短くしたいときは、フォームの「送信」→リンクの印→「URLを短縮」で出る forms.gle のURLを使えます。' : ''));
        } else if(d.shorturl){
          shortBox.value = d.shorturl;
        } else {
          shortBox.value = '';
          showMsg('短いURLを作れませんでした(' + (d.errormessage || '理由不明') + ')。QRコードはそのまま使えます。');
        }
      })
      .catch(function(){
        shortBox.value = '';
        showMsg('短いURLを作れませんでした(通信できません)。QRコードはそのまま使えます。');
      })
      .then(function(){
        // 短いURLが作れなかったときは「短いURL」を選べないようにする
        kindShort.disabled = !shortBox.value;
        if(!shortBox.value) document.querySelector('input[name="qrkind"][value="long"]').checked = true;
        showQR();
        result.hidden = false;
        make.disabled = false;
        make.textContent = '作成する';
      });
  });

  copyBtn.addEventListener('click', function(){
    if(!shortBox.value) return;
    shortBox.select();
    var done = function(){ copyBtn.textContent = 'コピーしました'; setTimeout(function(){ copyBtn.textContent = 'コピー'; }, 1500); };
    if(navigator.clipboard){ navigator.clipboard.writeText(shortBox.value).then(done, function(){ document.execCommand('copy'); done(); }); }
    else { document.execCommand('copy'); done(); }
  });

  saveBtn.addEventListener('click', function(){
    var t = qrHost.dataset.text;
    if(!t) return;
    var c = drawQR(t, 1200);
    var a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = 'qrcode.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>

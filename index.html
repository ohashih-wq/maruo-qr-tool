<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL短縮・QRコード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#eef2f5; --surface:#ffffff; --fg:#17242f; --muted:#5c7184;
    --accent:#e4572e; --accent-ink:#ffffff; --line:#c7d2db; --warn:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101a23; --surface:#16222d; --fg:#e8eef3; --muted:#90a3b2;
      --accent:#ff7a45; --accent-ink:#1a0d06; --line:#2b3d4c; --warn:#ff8a80;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:'Hiragino Sans','Noto Sans JP',sans-serif;
    padding:40px 16px;
  }
  .card{
    width:100%; max-width:480px; background:var(--surface);
    border:1px solid var(--line); border-radius:6px; padding:28px 24px;
  }
  h1{font-size:18px; margin:0 0 6px}
  p.lede{color:var(--muted); font-size:13px; line-height:1.7; margin:0 0 20px}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px}
  input{
    width:100%; font-size:14px; padding:10px 12px;
    border:1px solid var(--line); border-radius:4px;
    background:var(--bg); color:var(--fg);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; margin-top:14px; padding:11px 16px;
    font-size:14px; font-weight:600; text-decoration:none;
    background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:4px; cursor:pointer;
  }
  .btn:disabled{opacity:.45; cursor:default}
  .btn.outline{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
  .msg{font-size:13px; line-height:1.7; margin:10px 0 0; color:var(--warn)}
  .result{margin-top:22px; padding-top:20px; border-top:1px solid var(--line)}
  .row{display:flex; gap:8px}
  .row input{flex:1; font-weight:600}
  .row .btn{width:auto; margin-top:0; white-space:nowrap}
  .qr-zone{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:20px}
  .qr-zone canvas{border-radius:2px; box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .note{font-size:12px; color:var(--muted); line-height:1.7; margin:8px 0 0}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="card">
    <h1>URL短縮・QRコード</h1>
    <p class="lede">URLを入れて「作成する」を押すと、短いURLとQRコードを同じ画面に出します。QRコードは<b>ほかのサイトで作らず</b>、この画面のものを使ってください。</p>

    <label for="url">元のURL(お客様に見せたいページ)</label>
    <input id="url" type="text" inputmode="url" placeholder="https://www.maruo1.com/event/〜">
    <button id="make" class="btn" type="button" disabled>作成する</button>
    <p id="msg" class="msg" hidden></p>

    <div id="result" class="result" hidden>
      <label for="short">短いURL(文字で貼るとき用)</label>
      <div class="row">
        <input id="short" type="text" readonly>
        <button id="copy" class="btn outline" type="button">コピー</button>
      </div>
      <p class="note">is.gd の短縮URLです。広告をはさまず、そのまま元のページへ移ります。</p>

      <div class="qr-zone">
        <div id="qrcode"></div>
        <button id="save" class="btn outline" type="button">QRコードを保存</button>
        <p class="note">このQRコードには元のURLがそのまま入っています。短縮サービスを通らないので、読んだときに広告は出ません。印刷は2cm角以上にしてください。</p>
      </div>
    </div>
  </div>

<script>
  var input = document.getElementById('url');
  var make = document.getElementById('make');
  var msg = document.getElementById('msg');
  var result = document.getElementById('result');
  var shortBox = document.getElementById('short');
  var copyBtn = document.getElementById('copy');
  var saveBtn = document.getElementById('save');
  var qrHost = document.getElementById('qrcode');

  // 短縮URLを元のURLにすると、QRも短縮サービスを通って広告が出ることがあるので受け付けない
  var SHORTENERS = /^(www\.)?(tinyurl\.com|preview\.tinyurl\.com|bit\.ly|is\.gd|v\.gd|t\.co|ow\.ly|buff\.ly|goo\.gl|x\.gd|cutt\.ly|rebrand\.ly|shorturl\.at|t\.ly)$/i;

  function showMsg(text){ msg.textContent = text; msg.hidden = !text; }

  function check(){
    var v = input.value.trim();
    var host = '';
    try { host = new URL(v).hostname; } catch(e) {}
    var ok = /^https?:\/\//i.test(v) && host !== '';
    // 日本語の入ったURLは %xx の形にそろえる(読み取るスマホによって文字化けしないように)
    if(ok) v = new URL(v).href;
    if(ok && SHORTENERS.test(host)){
      showMsg('短縮済みのURL(' + host + ')が入っています。短縮する前の元のURLを入れてください。');
      ok = false;
    } else {
      showMsg('');
    }
    return ok ? v : null;
  }

  // 1マスを整数の画素で描き、周りに4マスの白い余白を付ける(半端な大きさだと読めないQRになる)
  function drawQR(text){
    var qr = qrcode(0, 'M');
    qr.addData(text, 'Byte');
    qr.make();
    var n = qr.getModuleCount(), quiet = 4;
    var cell = Math.max(4, Math.floor(280 / (n + quiet * 2)));
    var c = document.createElement('canvas');
    c.width = c.height = (n + quiet * 2) * cell;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#000';
    for(var r = 0; r < n; r++){
      for(var k = 0; k < n; k++){
        if(qr.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
      }
    }
    qrHost.innerHTML = '';
    qrHost.appendChild(c);
  }

  input.addEventListener('input', function(){
    // 入力を変えたら古い結果は消す
    result.hidden = true;
    qrHost.innerHTML = '';
    shortBox.value = '';
    make.disabled = !check();
  });

  make.addEventListener('click', function(){
    var v = check();
    if(!v) return;
    make.disabled = true;
    make.textContent = '作成中…';
    drawQR(v);

    fetch('https://is.gd/create.php?format=json&url=' + encodeURIComponent(v))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.shorturl){
          shortBox.value = d.shorturl;
        } else {
          shortBox.value = '';
          showMsg('短いURLを作れませんでした(' + (d.errormessage || '理由不明') + ')。QRコードはそのまま使えます。');
        }
      })
      .catch(function(){
        shortBox.value = '';
        showMsg('短いURLを作れませんでした(通信できません)。QRコードはそのまま使えます。');
      })
      .then(function(){
        result.hidden = false;
        make.disabled = false;
        make.textContent = '作成する';
      });
  });

  copyBtn.addEventListener('click', function(){
    if(!shortBox.value) return;
    shortBox.select();
    var done = function(){ copyBtn.textContent = 'コピーしました'; setTimeout(function(){ copyBtn.textContent = 'コピー'; }, 1500); };
    if(navigator.clipboard){ navigator.clipboard.writeText(shortBox.value).then(done, function(){ document.execCommand('copy'); done(); }); }
    else { document.execCommand('copy'); done(); }
  });

  saveBtn.addEventListener('click', function(){
    var c = qrHost.querySelector('canvas');
    if(!c) return;
    var a = document.createElement('a');
    a.href = c.toDataURL('image/png');
    a.download = 'qrcode.png';
    document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>
